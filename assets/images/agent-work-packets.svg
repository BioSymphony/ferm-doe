<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Coordinate Bounded Agent Work</title><desc id="desc">An orchestrator defines tasks with dependencies and acceptance checks. Workers return scoped artifacts for evidence, assays, costs, or scale. An integrator checks the outputs and assembles one packet for human review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#176b68" stroke-width="1.6"/></marker></defs>
<style>
text { font-family:Arial,Helvetica,sans-serif; fill:#123d3c; }
.heading { font-size:28px; font-weight:700; }
.label { font-size:23px; font-weight:700; }
.body { font-size:21px; fill:#355b58; }
.tag { font-size:19px; font-weight:700; fill:#176b68; }
.light { fill:#fffaf0; }
.line { fill:none; stroke:#176b68; stroke-width:2.5; marker-end:url(#arrow); }
.muted { fill:#fff2d9; stroke:#a87b2c; }
</style>
<rect width="960" height="340" rx="18" fill="#f6f8f4"/>
<text x="32" y="47" class="heading">Coordinate Bounded Agent Work</text>
<rect x="32" y="90" width="272" height="214" rx="12" fill="#ffffff" stroke="#bed3ce" stroke-width="1.5"/>
<text x="52" y="121" class="tag">1 · ORCHESTRATOR</text>
<text x="52" y="155" class="label">Define the tasks</text>
<text x="52" y="189" class="body">Inputs and outputs</text>
<text x="52" y="217" class="body">Dependencies</text>
<text x="52" y="245" class="body">Acceptance checks</text>
<rect x="344" y="90" width="272" height="214" rx="12" fill="#ffffff" stroke="#bed3ce" stroke-width="1.5"/>
<text x="364" y="121" class="tag">2 · WORKERS</text>
<text x="364" y="155" class="label">Return artifacts</text>
<text x="364" y="189" class="body">Evidence and sources</text>
<text x="364" y="217" class="body">Assay or cost checks</text>
<text x="364" y="245" class="body">Scale calculations</text>
<rect x="656" y="90" width="272" height="214" rx="12" fill="#075350" stroke="#075350" stroke-width="1.5"/>
<text x="676" y="121" class="tag light">3 · INTEGRATOR</text>
<text x="676" y="155" class="label light">Assemble one packet</text>
<text x="676" y="189" class="body light">Check returned work</text>
<text x="676" y="217" class="body light">Retain source references</text>
<text x="676" y="245" class="body light">Queue human review</text>
<path d="M304 197 H338" class="line"/>
<path d="M616 197 H650" class="line"/>
</svg>
